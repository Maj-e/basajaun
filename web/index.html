<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ulinautas — Fire hotspots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Martian+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="vendor/maplibre-gl-4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <!-- Everything starts downloading at once: MapLibre is deferred (runs before app.js, in order), modules are preloaded -->
  <script src="vendor/maplibre-gl-4.7.1/maplibre-gl.js" defer></script>
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="state.js">
  <link rel="modulepreload" href="map.js">
  <link rel="modulepreload" href="layers/loader.js">
  <link rel="modulepreload" href="timeline.js">
  <link rel="modulepreload" href="story.js">
  <link rel="modulepreload" href="readouts.js">
  <link rel="modulepreload" href="alerts.js">
  <script type="module" src="app.js"></script>
  <!-- Data the first screen needs, fetched while MapLibre downloads (same paths as config.js) -->
  <link rel="preload" href="data/manifest.json" as="fetch" crossorigin>
  <link rel="preload" href="data/processed/daily_summary.json" as="fetch" crossorigin>
  <link rel="preload" href="data/processed/hotspots.geojson" as="fetch" crossorigin>
</head>
<body>
  <!-- Design reference: docs/mockup/index.html (validated) and docs/demo-script.md -->
  <div id="map" role="img" aria-label="Map of the demo area showing satellite fire detections"></div>
  <p id="map-error" class="map-error" hidden></p>

  <header class="head">
    <div class="title">
      <h1 class="wordmark">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9.5" fill="none" stroke="#ec8128" stroke-width="1.5"/><circle cx="11" cy="11" r="4.2" fill="#ffd9a8"/></svg>
        Ulinautas
      </h1>
      <p class="caption"><strong>Active fires detected by NASA satellites</strong><br><span id="caption-scope">MODIS + VIIRS merged</span></p>
      <p class="scope" id="scope"><span id="scope-text">Figures for the whole area</span> <button type="button" id="scope-reset" hidden>Show whole area</button></p>
    </div>
    <dl class="readouts">
      <div class="readout">
        <dt>Active fires</dt>
        <dd id="r-active">–</dd>
        <div class="sub">last 24 h · <span id="r-total">–</span></div>
      </div>
      <div class="readout">
        <dt>Strongest fire</dt>
        <dd id="r-frp">–</dd>
        <div class="sub">FRP (fire intensity), last 24 h</div>
      </div>
    </dl>
  </header>

  <p id="status" class="status">Loading…</p>

  <aside class="alerts" id="alerts" aria-label="Population alerts" hidden>
    <button type="button" id="alerts-toggle" aria-expanded="false" aria-controls="alerts-list">Alerts <span id="alerts-count">0</span></button>
    <ol id="alerts-list" hidden></ol>
  </aside>

  <div class="peak-banner" id="peak-banner" hidden>
    <div class="callout"><b>Peak day</b><span class="big" id="peak-count"></span> <span id="peak-text"></span></div>
  </div>

  <nav class="tools" aria-label="Map tools">
    <button type="button" id="layers-toggle" aria-expanded="false" aria-controls="panel-layers">Layers</button>
  </nav>
  <section id="panel-layers" class="layers-panel" hidden aria-label="Layers">
    <h2>Layers</h2>
    <label><input type="checkbox" id="satellite-toggle"> Satellite image of the day <small>NASA VIIRS true color · needs internet</small></label>
    <div id="layer-list"></div>
  </section>

  <aside class="legend" id="legend" aria-label="Legend" hidden></aside>
  <p class="sat-badge" id="sat-badge" hidden></p>

  <section id="timeline" class="timeline" aria-label="Playback">
    <div class="clock">
      <div>
        <div class="date" id="c-date">–</div>
        <div class="time" id="c-time">–</div>
      </div>
      <div class="controls">
        <button type="button" class="btn play" id="b-play" aria-label="Play">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" id="i-play"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
        </button>
        <button type="button" class="btn" id="b-spark" title="Jump to the spark (S)">Spark</button>
        <button type="button" class="btn" id="b-peak" title="Jump to the peak (P)">Peak</button>
        <div class="speed" role="group" aria-label="Playback speed">
          <button type="button" class="btn" data-speed="3" aria-pressed="false">×1</button>
          <button type="button" class="btn" data-speed="8" aria-pressed="true">×2</button>
          <button type="button" class="btn" data-speed="20" aria-pressed="false">×4</button>
        </div>
      </div>
    </div>
    <div class="strip" id="strip">
      <svg id="chart" viewBox="0 0 1400 96" preserveAspectRatio="none" role="img" aria-label="Fires per day"></svg>
      <div class="days" id="days"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="keys" aria-hidden="true">
      <span><kbd>Space</kbd>play / pause</span><span><kbd>S</kbd>spark</span><span><kbd>P</kbd>peak</span>
      <span><kbd>←</kbd><kbd>→</kbd>one hour</span><span><kbd>R</kbd>restart</span>
    </div>
  </section>

</body>
</html>
