<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ulinautas — Fire hotspots</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Ulinautas <span>MODIS + VIIRS fire hotspots</span></h1>
    <p id="status" class="status">Loading…</p>
  </header>

  <!-- Each area has a stable id: modules from later waves mount here without touching the HTML -->
  <aside class="panel panel-left">
    <section id="panel-filters"><h2>Filters</h2><p class="empty">Coming soon</p></section>
    <section id="panel-calendar"><h2>Calendar</h2><p class="empty">Coming soon</p></section>
    <section id="panel-layers"><h2>Layers</h2><p class="empty">Coming soon</p></section>
  </aside>

  <main id="map" class="map" aria-label="Fire hotspot map"></main>

  <aside class="panel panel-right">
    <section id="panel-alerts"><h2>Alerts</h2><p class="empty">Coming soon</p></section>
  </aside>

  <footer id="timeline" class="timeline"><p class="empty">Timeline — coming soon</p></footer>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
