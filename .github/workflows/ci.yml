name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:        # "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (Python from .python-version, versions from uv.lock)
        run: uv sync --locked

      - name: Contract self-test (validator accepts good files, rejects broken ones)
        run: make contract-test

      - name: Unit tests
        run: make test

      - name: Validate data contract (web/data/ against docs/schemas/)
        run: make validate
