[project]
name = "ulinautas"
version = "0.1.0"
description = "MODIS + VIIRS (NASA FIRMS) fire hotspots, harmonized and published as static data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "rasterio>=1.4",
  "rasterstats>=0.20",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "jsonschema>=4.23",
  "referencing>=0.37.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
addopts = "-q"
